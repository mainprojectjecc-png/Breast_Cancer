<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuantumMed | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
      padding: 20px;
    }
    
    .login-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    
    .login-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 155, 197, 0.2);
      border-radius: var(--radius-card);
      padding: 48px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-card);
      text-align: center;
      animation: formFadeIn 0.8s ease-out;
    }
    
    @keyframes formFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .login-header {
      margin-bottom: 32px;
    }
    
    .login-header h2 {
      font-size: 2.2rem;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      color: var(--text-primary);
      margin-top: 16px;
    }
    
    .login-header p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 8px;
      line-height: 1.5;
    }
    
    .form-group {
      margin-bottom: 24px;
      text-align: left;
    }
    
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    
    .form-control {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-glass);
      background: rgba(255, 155, 197, 0.03);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--text-primary);
      transition: all 0.3s ease;
    }
    
    .form-control:focus {
      outline: none;
      border-color: var(--cyan);
      background: rgba(255, 155, 197, 0.08);
      box-shadow: 0 0 0 4px rgba(255, 155, 197, 0.1);
    }
    
    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      font-size: 0.85rem;
    }
    
    .login-options a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }
    
    .login-options a:hover {
      color: var(--purple);
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
    }
    
    .btn-login-submit {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: var(--gradient-main);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    
    .btn-login-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 155, 197, 0.3);
    }
    
    .login-footer {
      margin-top: 32px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    
    .login-footer a {
      color: var(--text-primary);
      font-weight: 700;
      text-decoration: none;
      transition: color 0.3s;
    }
    
    .login-footer a:hover {
      color: var(--cyan);
    }
    
    .back-nav {
      position: absolute;
      top: 32px;
      left: 32px;
      z-index: 10;
    }
    
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    
    .back-btn:hover {
      background: var(--bg-glass);
      border-color: rgba(255, 155, 197, 0.3);
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="login-bg">
      <div class="hero-orb orb1"></div>
      <div class="hero-orb orb2"></div>
      <div class="hero-orb orb3"></div>
    </div>
    
    <div class="back-nav">
      <a href="home.html" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to Home
      </a>
    </div>

    <div class="login-card">
      <div class="login-header">
        <div class="logo-icon" style="justify-content: center;">
          <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="14" stroke="url(#logoGrad)" stroke-width="2" />
            <path d="M8 16 Q12 8 16 16 Q20 24 24 16" stroke="url(#logoGrad)" stroke-width="2" fill="none" stroke-linecap="round" />
            <circle cx="8" cy="16" r="2" fill="#ff9bc5" />
            <circle cx="24" cy="16" r="2" fill="#d946a6" />
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ff9bc5" />
                <stop offset="100%" stop-color="#d946a6" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h2>Welcome Back</h2>
        <p>Enter your credentials to access the quantum dashboard.</p>
      </div>

      <form action="home.html" method="GET">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="doctor@quantummed.ai" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="login-options">
          <div class="checkbox-group">
            <input type="checkbox" id="remember">
            <label for="remember" style="margin: 0; font-size: 0.85rem;">Remember me</label>
          </div>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login-submit">Sign In</button>
      </form>

      <div class="login-footer">
        Don't have an account? <a href="#">Request Access</a>
      </div>
    </div>
  </div>

</body>
</html>
